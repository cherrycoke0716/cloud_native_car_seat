name: SDV Service CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install flake8 kuksa-client

      - name: Lint with flake8
        # 수정: 파일이 있는 src 폴더를 검사하도록 경로 지정
        run: flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Build Docker Image
        # 빌드 컨텍스트는 루트(.)로 유지하되, Dockerfile이 내부에서 src/를 참조함
        run: docker build -t seat-service:latest .

      # 여기에 Docker Hub 로그인 및 Push 과정을 넣으면 배포까지 완료됩니다.
      # 지금은 빌드가 성공하는지 확인하는 단계까지만 설정했습니다.
      - name: Build Success Check
        run: echo "Build and Test Successful!"